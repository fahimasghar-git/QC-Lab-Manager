<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | QC Lab Manager</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 10px; }
        .logo-icon { font-size: 3rem; color: #0d6efd; margin-bottom: 1rem; }
    </style>
</head>
<body>
    <div class="card shadow-sm border-0 login-card text-center">
        <i class="fas fa-flask logo-icon"></i>
        <h3 class="fw-bold mb-4">LIMS Login</h3>
        
        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
            <div class="alert alert-danger py-2">
                Invalid username or password.
            </div>
            {% endif %}
            
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="id_username" name="username" placeholder="Username" required>
                <label for="id_username">Username</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="id_password" name="password" placeholder="Password" required>
                <label for="id_password">Password</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
            
            <p class="mt-4 mb-0 text-muted small">ISO/IEC 17025 Compliant System</p>
        </form>
    </div>
</body>
</html>
