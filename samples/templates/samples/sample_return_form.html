<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QCL-FRM-22.01 Sample Return Form</title>
    <style>
        @page {
            size: a4 portrait;
            margin-top: 4cm;
            margin-bottom: 2cm;
            margin-left: 1.5cm;
            margin-right: 1.5cm;
            @frame header_frame {
                -pdf-frame-content: header_content;
                left: 1.5cm; right: 1.5cm; top: 1cm; height: 3cm;
            }
            @frame footer_frame {
                -pdf-frame-content: footer_content;
                left: 1.5cm; right: 1.5cm; bottom: 0.5cm; height: 1cm;
            }
        }
        body { font-family: Helvetica, Arial, sans-serif; font-size: 11px; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid #000; padding: 5px; vertical-align: middle; }
        th { background-color: #d9d9d9; font-weight: bold; text-align: center; }
        .header-table th, .header-table td { text-align: center; vertical-align: middle; font-size: 12px; background-color: #fff; }
        .noborder { border: none; }
        .noborder td { border: none; }
    </style>
</head>
<body>
    <div id="header_content">
        <table class="header-table">
            <tr>
                <td rowspan="3" width="20%">
                    <img src="/Users/fahimasghar/Documents/QC-Lab-Manager/static/images/logo1.png" style="height: 50px;" alt="Logo" />
                </td>
                <td rowspan="3" width="50%" style="font-size: 16px; font-weight: bold;">
                    SAMPLE RETURN FORM
                </td>
                <td width="30%" style="text-align: left;"><strong>Format No.:</strong> QCL-FRM-22.01</td>
            </tr>
            <tr><td style="text-align: left;"><strong>Issue Date:</strong> 15-01-2024</td></tr>
            <tr><td style="text-align: left;"><strong>Revision No.:</strong> 01</td></tr>
        </table>
    </div>
    <div id="footer_content" style="text-align: right; font-size: 10px;">
        Page <pdf:pagenumber> of <pdf:pagecount>
    </div>
    
    <table>
        <thead>
            <tr>
                <th style="width: 25%;">Sample ID</th>
                <th style="width: 25%;">Sample Return Date</th>
                <th style="width: 50%;">Reason for sample return</th>
            </tr>
        </thead>
        <tbody>
            {% for ret in returns %}
            <tr>
                <td style="text-align: center;">{{ ret.sample.sample_id }}</td>
                <td style="text-align: center;">{{ ret.return_date|date:"d-m-Y" }}</td>
                <td>{{ ret.reason }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    
</body>
</html>
